[project]
name = "comfyui-raw-denoise"
description = "AI noise reduction for camera RAW photos (RawNIND, Lightroom-style linear DNG output) and video (FastDVDnet, streamed for long clips, low VRAM, resumable)."
version = "1.1.0"
license = { file = "LICENSE" }
dependencies = ["rawpy>=0.19", "tifffile>=2023.1.1", "imageio-ffmpeg>=0.5"]

[tool.comfy]
DisplayName = "RAW AI Denoise"
